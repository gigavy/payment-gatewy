{% extends 'admin_base.html' %}

{% block content %}
<div class="mb-8 flex items-center gap-3">
    <div class="w-10 h-10 bg-indigo-50 text-indigo-500 rounded-full flex items-center justify-center text-lg shadow-sm border border-indigo-100">
        <i class="fa-solid fa-paper-plane"></i>
    </div>
    <div>
        <h1 class="text-2xl font-black text-slate-800">Broadcast Email</h1>
        <p class="text-xs text-slate-500 mt-1">Send a mass email to all registered merchants on the platform.</p>
    </div>
</div>

<div class="max-w-3xl bg-white rounded-2xl p-8 shadow-sm border border-slate-200">
    <h3 class="text-base font-bold text-slate-800 mb-6"><i class="fa-solid fa-envelope-open-text text-primary mr-2"></i> Compose Message</h3>
    
    <form action="/admin/broadcast" method="POST">
        <div class="mb-6">
            <label class="block text-sm font-bold text-slate-700 mb-2">Subject Line</label>
            <input type="text" name="subject" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-primary shadow-sm" placeholder="e.g., Important API Update">
        </div>
        
        <div class="mb-8">
            <label class="block text-sm font-bold text-slate-700 mb-2">Message Body (HTML supported)</label>
            <textarea name="message" rows="8" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-primary shadow-sm" placeholder="<h2>Hello Merchants,</h2><br>We have exciting news..."></textarea>
            <p class="text-[10px] text-slate-400 mt-2">You can use standard HTML tags like &lt;b&gt;, &lt;br&gt;, &lt;a&gt; for formatting.</p>
        </div>

        <button type="submit" onclick="return confirm('Are you sure you want to send this email to ALL users?');" class="w-full bg-primary hover:bg-indigo-700 text-white font-bold py-4 rounded-xl transition-all shadow-md shadow-indigo-500/30 text-sm flex items-center justify-center gap-2">
            <i class="fa-solid fa-paper-plane"></i> Send to All Merchants
        </button>
    </form>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.has("success")) {
        Swal.fire({
            icon: "success",
            title: "Broadcast Sent",
            text: urlParams.get("success"),
            confirmButtonColor: "#4f46e5"
        });
        window.history.replaceState({}, document.title, window.location.pathname);
    }
    if(urlParams.has("error")) {
        Swal.fire({
            icon: "error",
            title: "Failed",
            text: urlParams.get("error"),
            confirmButtonColor: "#ef4444"
        });
        window.history.replaceState({}, document.title, window.location.pathname);
    }
</script>
{% endblock %}
