<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Factor Authentication - NovaPay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: { 
                    colors: { primary: '#2563eb', darkblue: '#1e3a8a' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-slate-50">
    <div class="w-full max-w-md bg-white rounded-3xl p-8 shadow-xl shadow-slate-200/60 border border-slate-100 text-center">
        <div class="w-16 h-16 bg-blue-50 text-primary rounded-2xl flex items-center justify-center text-2xl mx-auto mb-6 border border-blue-100 shadow-sm">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        
        <h2 class="text-2xl font-black text-slate-800 mb-2">Two-Factor Authentication</h2>
        <p class="text-sm text-slate-500 mb-6">Open your Google Authenticator or Authy app and enter the 6-digit security code.</p>
        
        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-600 text-xs font-bold p-3.5 rounded-xl mb-6 flex items-center gap-2 text-left">
            <i class="fa-solid fa-triangle-exclamation text-base shrink-0"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}
        
        <form method="POST" action="/login/2fa">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="mb-6">
                <input type="text" 
                       name="code" 
                       maxlength="6" 
                       pattern="[0-9]{6}" 
                       inputmode="numeric" 
                       autofocus 
                       required 
                       placeholder="000000" 
                       class="w-full text-center text-3xl font-mono tracking-[0.4em] px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-slate-800 font-bold focus:outline-none focus:ring-2 focus:ring-primary focus:bg-white transition-all">
            </div>
            
            <button type="submit" class="w-full bg-primary hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition-all shadow-md shadow-blue-500/25 flex items-center justify-center gap-2">
                <span>Verify & Sign In</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>
        
        <div class="mt-6 pt-6 border-t border-slate-100">
            <a href="/login" class="text-xs font-bold text-slate-400 hover:text-slate-600 transition">
                <i class="fa-solid fa-arrow-left mr-1"></i> Back to sign in
            </a>
        </div>
    </div>
</body>
</html>
