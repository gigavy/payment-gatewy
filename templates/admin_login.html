<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - NovaPay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { primary: '#4f46e5' } }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-slate-800"><i class="fa-solid fa-shield-halved text-primary mr-2"></i> NovaPay</h1>
            <p class="text-sm text-slate-500 mt-2 font-bold uppercase tracking-wider">Super Admin Gateway</p>
        </div>
        
        <div class="bg-white rounded-3xl p-8 shadow-xl shadow-slate-200/50 border border-slate-100 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-purple-500"></div>
            
            {% if error %}
            <div class="bg-red-50 border border-red-100 text-red-600 text-xs font-bold p-3 rounded-xl mb-6 flex items-center gap-2">
                <i class="fa-solid fa-triangle-exclamation"></i> {{ error }}
            </div>
            {% endif %}
            
            <form action="/admin/login" method="POST">
                <div class="mb-6">
                    <label class="block text-xs font-bold text-slate-700 mb-2 uppercase tracking-wide">Admin Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="password" name="password" required class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-bold focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-slate-400" placeholder="Enter super password">
                    </div>
                </div>
                
                <button type="submit" class="w-full bg-primary hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-md shadow-indigo-500/30 transition-all flex items-center justify-center gap-2">
                    Access Console <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
        </div>
        
        <p class="text-center text-xs text-slate-400 mt-8 font-medium">Restricted Area. Authorized personnel only.</p>
    </div>
</body>
</html>
